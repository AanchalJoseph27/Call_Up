<div class="list-container">
    <p-table [lazy]="true" (onLazyLoad)="getAllExpProductbyId($event)" [value]="exp_productList"
        [tableStyle]="{ 'min-width': '50rem' }" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="30"
        [loading]="loading" [totalRecords]="totalRecords">
        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Expiry Date</th>

            </tr>
        </ng-template>
        <ng-template #body let-exp_productList>
            <tr>
                <td>{{ exp_productList.product_name }}</td>
                <td>{{ exp_productList.category_name }}</td>
                <td>{{ exp_productList.expiry_date |date }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
